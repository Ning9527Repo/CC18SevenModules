name: Build CC18 1.0 eight modules and one native enable switch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check reviewed source
        run: python3 tools/check_source.py
      - name: Verify eight physical modules and migration policy
        run: |
          python3 tools/retained_modules.py
          python3 tools/test_module_migration.py
      - name: Verify one native enable switch and old preference-page removal
        run: |
          python3 tools/test_settings.py
          python3 tools/test_enable_lifecycle.py
      - name: Check four-action backend and obsolete UI deletion
        run: python3 tools/test_power_root.py
      - name: Compile and sign companion
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build dist
          SRC=(Tweak.m C18FiveConfig.m C18FiveModules.m C18FiveEditor.m C18CarrierNames.m C18DataSwitch.m C18NativeLayoutRestore.m C18PowerMenu.m C18GlyphSources.m C18CellularRate.m C18PressDriver.m C18Localization.m C18UptimeFix.m)
          for ARCH in arm64 arm64e; do
            xcrun --sdk iphoneos clang -fobjc-arc -O2 \
              -Werror=implicit-function-declaration -Werror=objc-method-access \
              -Werror=incompatible-pointer-types -Werror=incompatible-function-pointer-types \
              -isysroot "$SDK" -target "${ARCH}-apple-ios15.0" -dynamiclib -I. \
              -framework Foundation -framework UIKit -framework CoreGraphics \
              -framework QuartzCore -framework CoreFoundation \
              -Wl,-undefined,dynamic_lookup -Wl,-install_name,@loader_path/C18ConnectivityFive.dylib \
              "${SRC[@]}" -o "build/C18ConnectivityFive-${ARCH}.dylib"
          done
          # Remove only local linker symbols; keep ObjC metadata and undefined hooks.
          for ARCH in arm64 arm64e; do
            xcrun strip -x "build/C18ConnectivityFive-${ARCH}.dylib"
          done
          xcrun lipo -create -output build/C18ConnectivityFive.dylib build/C18ConnectivityFive-arm64.dylib build/C18ConnectivityFive-arm64e.dylib
          codesign --force --sign - --timestamp=none build/C18ConnectivityFive.dylib
          for ARCH in arm64 arm64e; do
            xcrun --sdk iphoneos clang -std=c11 -O2 -Wall -Wextra -Werror \
              -isysroot "$SDK" -target "${ARCH}-apple-ios15.0" \
              C18PowerHelper.c -o "build/C18PowerHelper-${ARCH}"
            xcrun strip -x "build/C18PowerHelper-${ARCH}"
          done
          xcrun lipo -create -output build/C18PowerHelper build/C18PowerHelper-arm64 build/C18PowerHelper-arm64e
          codesign --force --sign - --timestamp=none --entitlements Resources/C18PowerHelper.entitlements build/C18PowerHelper
          codesign --verify --strict --all-architectures build/C18PowerHelper
      - name: Compile and sign enable-only native Settings adapter
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for ARCH in arm64 arm64e; do
            xcrun --sdk iphoneos clang -fobjc-arc -fblocks -O2 -Wall -Wextra -Werror \
              -isysroot "$SDK" -target "${ARCH}-apple-ios15.0" -dynamiclib -I. \
              -framework Foundation -framework UIKit -framework CoreFoundation \
              -Wl,-undefined,dynamic_lookup -Wl,-install_name,@loader_path/C18FourSettings.dylib \
              Settings/C18EnableControl.m Settings/C18SettingsBridge.m -o "build/C18FourSettings-${ARCH}.dylib"
            xcrun strip -x "build/C18FourSettings-${ARCH}.dylib"
          done
          xcrun lipo -create -output build/C18FourSettings.dylib build/C18FourSettings-arm64.dylib build/C18FourSettings-arm64e.dylib
          codesign --force --sign - --timestamp=none build/C18FourSettings.dylib
          codesign --verify --strict --all-architectures build/C18FourSettings.dylib
      - name: Renew pinned core signature requirements
        run: python3 tools/prepare_core.py
      - name: Package both user baselines
        run: python3 tools/package.py
      - name: Verify final package signatures and architectures
        run: python3 tools/verify_delivery.py
      - uses: actions/upload-artifact@v4
        with:
          name: CC18-1.0-eight-modules-enable-only
          path: |
            dist/com.evgeniy558.controlcenter18_1.0_iphoneos-arm64.deb
            dist/com.evgeniy558.controlcenter18_1.0_iphoneos-arm64e.deb
            build/package-validation.json
            build/retained-seven-validation.json
          if-no-files-found: error
